{% if page.meta.comments %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
  <script
    src="https://giscus.app/client.js"
    data-repo="iKeybot-code/scripts-ascend"
    data-repo-id=""
    data-category="Announcements"
    data-category-id=""
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="https://cdn.jsdelivr.net/gh/iKeybot-code/scripts-ascend@main/docs/giscus-theme-light.css"
    data-lang="zh-CN"
    crossorigin="anonymous"
    async
  >
  </script>
  <script>
    var GISCUS_LIGHT = "https://cdn.jsdelivr.net/gh/iKeybot-code/scripts-ascend@main/docs/giscus-theme-light.css";
    var GISCUS_DARK = "https://cdn.jsdelivr.net/gh/iKeybot-code/scripts-ascend@main/docs/giscus-theme-dark.css";
    var giscus = document.querySelector("script[src*=giscus]");
    var palette = __md_get("__palette");
    if (palette && typeof palette.color === "object") {
      var theme = palette.color.scheme === "slate"
        ? GISCUS_DARK
        : GISCUS_LIGHT;
      giscus.setAttribute("data-theme", theme);
    }
    document.addEventListener("DOMContentLoaded", function () {
      var ref = document.querySelector("[data-md-component=palette]");
      if (ref) {
        ref.addEventListener("change", function () {
          var palette = __md_get("__palette");
          if (palette && typeof palette.color === "object") {
            var theme = palette.color.scheme === "slate"
              ? GISCUS_DARK
              : GISCUS_LIGHT;
            var frame = document.querySelector(".giscus-frame");
            if (frame) {
              frame.contentWindow.postMessage(
                { giscus: { setConfig: { theme } } },
                "https://giscus.app"
              );
            }
          }
        });
      }
    });
  </script>
{% endif %}
